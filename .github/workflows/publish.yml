# Publish @cdp-wasm-suite/cdp-web (the self-contained static bundle) to GitHub
# Packages. The VST plugin (cdp-plugin) and Ableton Live extension
# (cdp-extension) consume this package instead of vendoring built assets.
#
# Runs on every push to main (or manually via workflow_dispatch): if the
# version in package.json has no vX.Y.Z release yet, it publishes the bundle
# and then creates the release itself — so bumping "version" and pushing is
# the entire release flow. The bundle is built from the committed ./vendor
# engine snapshot (see vendor-engine.mjs), so no npm install, wasm toolchain,
# or access to the private sibling repos is needed. GitHub Packages rejects
# re-publishing an existing version.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    # The package is @cdp-wasm-suite-scoped; GITHUB_TOKEN can only publish it
    # from within the org, so skip on the private dev mirror.
    if: github.repository_owner == 'cdp-wasm-suite'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      # The release is created last, after a successful publish, so a failed
      # publish leaves no release and the next push simply retries.
      - name: Check whether this version is already released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the self-contained bundle
        if: steps.check.outputs.released == 'false'
        run: node scripts/bundle.mjs

      # The leading ./ matters: npm reads a bare `dist/bundle` as the GitHub
      # shorthand owner/repo and tries to clone it over SSH.
      - name: Publish dist/bundle
        if: steps.check.outputs.released == 'false'
        run: npm publish ./dist/bundle
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Release notes come from CHANGELOG.md — `--generate-notes` has nothing
      # to summarise here, since this repo's history is one squashed snapshot
      # commit per release (see publish-clean.sh in the dev repo).
      - name: Create the GitHub release
        if: steps.check.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          awk "/^## \[$VERSION\]/{f=1;next} /^## \[/{f=0} f" CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            printf '\n**Try it: https://cdp-web.app/**\n' >> notes.md
            gh release create "v$VERSION" -R "$GITHUB_REPOSITORY" \
              --title "v$VERSION" --notes-file notes.md
          else
            echo "⚠ no CHANGELOG.md section for $VERSION — falling back to generated notes"
            gh release create "v$VERSION" -R "$GITHUB_REPOSITORY" \
              --title "v$VERSION" --generate-notes
          fi
